<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../content.css">
</head>
<body>
  <ytd-guide-entry-renderer id="shorts-nav"><a href="https://www.youtube.com/shorts">Shorts</a></ytd-guide-entry-renderer>
  <ytd-mini-guide-entry-renderer id="compact-shorts-nav" aria-label="Shorts"><button type="button">Shorts</button></ytd-mini-guide-entry-renderer>
  <ytd-guide-entry-renderer id="channel-called-shorts"><a href="https://www.youtube.com/channel/abc">Shorts</a></ytd-guide-entry-renderer>
  <ytd-mini-guide-entry-renderer id="gaming-nav"><a href="https://www.youtube.com/gaming">Gaming</a></ytd-mini-guide-entry-renderer>
  <ytd-guide-entry-renderer id="playables-nav"><a href="https://www.youtube.com/playables">Playables</a></ytd-guide-entry-renderer>

  <ytd-rich-item-renderer id="shorts-card"><a href="https://www.youtube.com/shorts/abc">Short</a></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="normal-card"><a href="https://www.youtube.com/watch?v=abc">Normal video</a></ytd-rich-item-renderer>
  <ytd-compact-video-renderer id="live-card"><a href="https://www.youtube.com/live/abc">Live stream</a></ytd-compact-video-renderer>
  <ytd-rich-item-renderer id="playables-card"><a href="https://www.youtube.com/playables/abc">Playable</a></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="game-card"><a href="https://www.youtube.com/gaming/game/abc">Game</a></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="reused-card"><a id="reused-link" href="https://www.youtube.com/shorts/old">Old Short</a></ytd-rich-item-renderer>
  <ytd-video-renderer id="video-with-game-metadata">
    <a href="https://www.youtube.com/watch?v=game-video">Gaming video</a>
    <ytd-rich-metadata-renderer id="game-metadata"><a href="https://www.youtube.com/gaming/game/abc">Game page</a></ytd-rich-metadata-renderer>
  </ytd-video-renderer>

  <ytd-rich-section-renderer id="shorts-section"><ytd-rich-shelf-renderer id="shorts-shelf"><div id="header"><h2>Shorts</h2></div></ytd-rich-shelf-renderer></ytd-rich-section-renderer>
  <ytd-rich-section-renderer id="live-games-section"><ytd-rich-shelf-renderer><div id="header"><h2>Top live games</h2></div><div>Auto-generated by YouTube</div></ytd-rich-shelf-renderer></ytd-rich-section-renderer>
  <ytd-rich-section-renderer id="playables-section"><ytd-rich-shelf-renderer is-mini-game-card-shelf><div id="header"><h2>Playables</h2></div></ytd-rich-shelf-renderer></ytd-rich-section-renderer>
  <ytd-rich-shelf-renderer id="mixed-shelf"><div id="header"><h2>Recommended</h2></div><ytd-rich-item-renderer id="mixed-short"><a href="https://www.youtube.com/shorts/mixed">Short</a></ytd-rich-item-renderer><ytd-rich-item-renderer id="mixed-video"><a href="https://www.youtube.com/watch?v=mixed">Video</a></ytd-rich-item-renderer></ytd-rich-shelf-renderer>

  <output id="result"></output>
  <script>
    window.compactShortsHiddenBeforeScript =
      getComputedStyle(document.getElementById("compact-shorts-nav")).display === "none";
  </script>
  <script src="../rules.js"></script>
  <script src="../content.js"></script>
  <script>
    setTimeout(() => {
      document.getElementById("reused-link").href = "https://www.youtube.com/watch?v=reused";
      const dynamic = document.createElement("ytd-video-renderer");
      dynamic.id = "dynamic-short";
      dynamic.innerHTML = '<a href="https://www.youtube.com/shorts/new">New Short</a>';
      document.body.append(dynamic);
      const responsiveNav = document.createElement("ytd-mini-guide-entry-renderer");
      responsiveNav.id = "responsive-shorts-nav";
      responsiveNav.setAttribute("aria-label", "Shorts");
      responsiveNav.innerHTML = "<button>Shorts</button>";
      document.body.append(responsiveNav);

      setTimeout(() => {
        const hidden = (id) => getComputedStyle(document.getElementById(id)).display === "none";
        const checks = {
          shortsNav: hidden("shorts-nav"), compactShortsNav: hidden("compact-shorts-nav"),
          compactShortsHiddenBeforeScript: window.compactShortsHiddenBeforeScript,
          responsiveShortsNav: hidden("responsive-shorts-nav"),
          channelCalledShortsVisible: !hidden("channel-called-shorts"),
          gamingNav: hidden("gaming-nav"),
          playablesNav: hidden("playables-nav"), shortsCard: hidden("shorts-card"),
          playablesCard: hidden("playables-card"), gameCard: hidden("game-card"),
          gameMetadata: hidden("game-metadata"), shortsSection: hidden("shorts-section"),
          liveGamesSection: hidden("live-games-section"),
          playablesSection: hidden("playables-section"), dynamicShort: hidden("dynamic-short"),
          mixedShort: hidden("mixed-short"), mixedShelfVisible: !hidden("mixed-shelf"),
          mixedVideoVisible: !hidden("mixed-video"), reusedCardVisible: !hidden("reused-card"),
          normalCardVisible: !hidden("normal-card"), liveCardVisible: !hidden("live-card"),
          gamingVideoVisible: !hidden("video-with-game-metadata")
        };
        document.getElementById("result").textContent = JSON.stringify(checks);
      }, 100);
    }, 20);
  </script>
</body>
</html>
